
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#030a16">
  <meta name="description" content="Kontakta Juridik.ai med frågor, idéer och förslag via vårt kontaktformulär.">
  <link rel="canonical" href="https://juridik.ai/contact/">
  <title>Kontakt — Juridik.ai</title>

  <link rel="icon" type="image/png" href="/Favicon2.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="/Favicon1.png" media="(prefers-color-scheme: light)">

  <style>
    :root {
      color-scheme: dark;
      --page: #030b1a;
      --white: #f5f7fb;
      --secondary: #a1afc5;
      --soft: #73839d;
      --rule: rgba(182, 199, 227, .18);
      --rule-hover: rgba(208, 222, 244, .55);
      --focus: #d3e1ff;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Geist", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      background: radial-gradient(
        ellipse 83% 87% at 49% 44%,
        #091b37 0%,
        #06142a 49%,
        #030b1b 81%,
        #020713 100%
      );
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    button, input, textarea {
      font: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 5px;
    }

    input:focus-visible,
    textarea:focus-visible {
      outline: none;
    }

    .shell {
      width: min(100% - 112px, 1232px);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 114px;
      padding-top: 1px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #a2b1c7;
      text-decoration: none;
      font-size: 13px;
      transition: color .2s ease;
    }

    .home-link svg {
      width: 15px;
      height: 15px;
      transition: transform .2s ease;
    }

    .home-link:hover {
      color: #fff;
    }

    .home-link:hover svg {
      transform: translateX(-3px);
    }

    .contact {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(0, .98fr);
      align-items: center;
      padding: 55px 0 93px;
    }

    .editorial {
      order: 2;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 40px 0 0 clamp(42px, 5.8vw, 90px);
    }

    h1 {
      margin: 0;
      font-size: clamp(70px, 7.7vw, 116px);
      font-weight: 500;
      line-height: 1.06;
      letter-spacing: -.082em;
    }

    h1 .dot {
      color: #b3c2d8;
    }

    .lead {
      max-width: 430px;
      margin: 43px 0 17px;
      font-size: clamp(21px, 2vw, 26px);
      font-weight: 400;
      line-height: 1.38;
      letter-spacing: -.035em;
    }

    .form-column {
      order: 1;
      width: 100%;
      min-height: 560px;
      border-right: 1px solid var(--rule);
      padding: 43px clamp(42px, 5.8vw, 90px) 0 0;
    }

    .form-heading {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      padding-bottom: 19px;
      border-bottom: 1px solid var(--rule);
    }

    .form-heading h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: -.012em;
      font-weight: 550;
    }

    .form-heading .index {
      color: #667894;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .03em;
    }

    .field {
      padding-top: 24px;
    }

    .field label {
      display: flex;
      gap: 8px;
      align-items: baseline;
      color: #d5deee;
      font-size: 12px;
      font-weight: 550;
    }

    .field label .optional {
      color: #6f809d;
      font-weight: 400;
    }

    .field input,
    .field textarea {
      display: block;
      width: 100%;
      padding: 14px 0 15px;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      background: transparent;
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      transition: border-color .2s ease;
      appearance: none;
    }

    .field input {
      height: 54px;
    }

    .field textarea {
      min-height: 115px;
      max-height: 300px;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #657792;
      opacity: 1;
    }

    .field input:hover,
    .field textarea:hover {
      border-bottom-color: var(--rule-hover);
    }

    .field input:focus,
    .field textarea:focus {
      border-bottom-color: #d5e2f7;
    }

    .field:focus-within label {
      color: #fff;
    }

    .footer-form {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 22px;
      margin-top: 26px;
    }

    .privacy {
      max-width: 300px;
      margin: 0;
      font-size: 11px;
      color: #899bb5;
      line-height: 1.65;
    }

    .privacy a {
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #5b708e;
    }

    .privacy a:hover {
      color: #fff;
    }

    .send {
      flex-shrink: 0;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 47px;
      padding: 0 19px;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 5px;
      background: #f8f9fc;
      color: #071329;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    .send svg {
      width: 16px;
      height: 16px;
    }

    .send:hover:not(:disabled) {
      background: #dbe6f7;
      transform: translateY(-1px);
    }

    .send:disabled {
      opacity: .75;
      cursor: wait;
    }

    .status {
      display: none;
      margin: 16px 0 0;
      padding: 11px 13px;
      border-left: 2px solid;
      font-size: 12px;
      line-height: 1.65;
    }

    .status[data-state="success"] {
      display: block;
      color: #bce8d3;
      border-color: #91dcb8;
      background: rgba(27, 99, 73, .15);
    }

    .status[data-state="error"] {
      display: block;
      color: #f6c4c4;
      border-color: #e6a1a1;
      background: rgba(124, 39, 49, .14);
    }

    .honeypot {
      position: absolute !important;
      left: -10000px !important;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    @media (max-width: 1050px) {
      .shell {
        width: min(100% - 72px, 1232px);
      }

      .editorial {
        padding-left: 35px;
      }

      .form-column {
        padding-right: 35px;
      }

      .footer-form {
        align-items: stretch;
        flex-direction: column;
        gap: 20px;
      }

      .privacy {
        max-width: none;
      }

      .send {
        align-self: flex-start;
      }
    }

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 44px, 560px);
      }

      .header {
        min-height: 86px;
      }

      .contact {
        display: block;
        padding: 51px 0 72px;
      }

      .editorial {
        min-height: 0;
        padding: 0;
      }

      h1 {
        font-size: clamp(66px, 14vw, 95px);
      }

      .lead {
        margin: 27px 0 13px;
        font-size: 22px;
      }

      .form-column {
        min-height: 0;
        border-right: 0;
        padding: 48px 0 0;
      }

      .form-heading {
        padding-bottom: 18px;
      }

      .footer-form {
        margin-top: 22px;
        gap: 22px;
      }

      .send {
        min-width: 190px;
      }
    }

    @media (max-width: 420px) {
      .shell {
        width: calc(100% - 36px);
      }

      .header {
        min-height: 76px;
      }

      .home-link {
        gap: 7px;
        font-size: 12px;
      }

      .contact {
        padding-top: 39px;
      }

      .lead {
        font-size: 21px;
      }

      .form-column {
        padding-top: 42px;
      }

      .field {
        padding-top: 21px;
      }

      .field input,
      .field textarea {
        font-size: 16px;
      }

      .send {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="shell">

    <header class="header">
      <a class="home-link" href="/">
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M19 12H5m7 7-7-7 7-7"/>
        </svg>
        Till startsidan
      </a>
    </header>

    <main class="contact">

      <section class="editorial" aria-labelledby="page-title">
        <h1 id="page-title">Kontakt<span class="dot">.</span></h1>
        <p class="lead">Har du en fråga, en idé eller ett förslag?</p>
      </section>

      <section class="form-column" aria-labelledby="form-title">

        <div class="form-heading">
          <h2 id="form-title">Skicka ett meddelande</h2>
          <span class="index" aria-hidden="true">01 / 01</span>
        </div>

        <form id="contact-form"
              action="https://formspree.io/f/xaeekvnp"
              method="POST">

          <div class="field">
            <label for="contact-name">
              Namn <span class="optional">(valfritt)</span>
            </label>
            <input
              id="contact-name"
              type="text"
              name="name"
              autocomplete="name"
              maxlength="100"
              placeholder="Ditt namn"
            >
          </div>

          <div class="field">
            <label for="contact-email">E-postadress</label>
            <input
              id="contact-email"
              type="email"
              name="email"
              autocomplete="email"
              maxlength="254"
              placeholder="namn@exempel.se"
              required
            >
          </div>

          <div class="field">
            <label for="contact-message">Meddelande</label>
            <textarea
              id="contact-message"
              name="message"
              placeholder="Skriv ditt meddelande..."
              required
              minlength="10"
              maxlength="5000"
            ></textarea>
          </div>

          <div class="honeypot" aria-hidden="true">
            <label for="contact-company">Lämna detta fält tomt</label>
            <input
              id="contact-company"
              name="_gotcha"
              type="text"
              tabindex="-1"
              autocomplete="off"
            >
          </div>

          <input
            type="hidden"
            name="_subject"
            value="Nytt kontaktmeddelande – Juridik.ai"
          >

          <div class="footer-form">
            <p class="privacy">
              Skicka inte personnummer eller känsliga uppgifter.
              Läs vår <a href="/policy/">integritetspolicy</a>.
            </p>

            <button class="send" id="submit-button" type="submit">
              <span id="submit-label">Skicka meddelande</span>
              <svg viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <path d="M5 12h14m-7-7 7 7-7 7"/>
              </svg>
            </button>
          </div>

          <p
            id="form-status"
            class="status"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>

        </form>

        <noscript>
          <p class="privacy">
            JavaScript är avstängt. Formuläret skickas
            då via Formsprees vanliga formulärhantering.
          </p>
        </noscript>

      </section>
    </main>

  </div>

  <script>
    (() => {
      'use strict';

      const form = document.getElementById('contact-form');
      const button = document.getElementById('submit-button');
      const buttonLabel = document.getElementById('submit-label');
      const status = document.getElementById('form-status');

      let submitting = false;

      function showStatus(state, text) {
        status.dataset.state = state;
        status.textContent = text;
      }

      form.addEventListener('input', () => {
        if (status.dataset.state === 'error') {
          status.removeAttribute('data-state');
          status.textContent = '';
        }
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (submitting || !form.reportValidity()) return;

        submitting = true;
        button.disabled = true;
        buttonLabel.textContent = 'Skickar…';

        status.removeAttribute('data-state');
        status.textContent = '';

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);

        try {
          const response = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: {
              'Accept': 'application/json'
            },
            signal: controller.signal
          });

          if (response.ok) {
            form.reset();
            showStatus(
              'success',
              'Tack! Ditt meddelande har tagits emot.'
            );
          } else if (response.status === 429) {
            showStatus(
              'error',
              'För många försök just nu. Försök igen senare.'
            );
          } else if (response.status === 400 || response.status === 422) {
            showStatus(
              'error',
              'Meddelandet kunde inte skickas. Kontrollera uppgifterna och försök igen.'
            );
          } else {
            showStatus(
              'error',
              'Något gick fel när meddelandet skickades. Försök igen senare.'
            );
          }
        } catch (error) {
          if (error.name === 'AbortError') {
            showStatus(
              'error',
              'Ingen bekräftelse kom från tjänsten. Kontrollera innan du skickar igen, eftersom meddelandet kan ha kommit fram.'
            );
          } else {
            showStatus(
              'error',
              'Anslutningen misslyckades. Kontrollera nätverket och försök igen.'
            );
          }
        } finally {
          clearTimeout(timeout);
          submitting = false;
          button.disabled = false;
          buttonLabel.textContent = 'Skicka meddelande';
        }
      });
    })();
  </script>
</body>
</html>
