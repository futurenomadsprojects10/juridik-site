
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#030d1d">
  <meta name="description" content="Kontakta Juridik.ai med frågor, idéer och förslag via vårt kontaktformulär.">
  <link rel="canonical" href="https://juridik.ai/contact/">
  <title>Kontakt — Juridik.ai</title>

  <link rel="icon" type="image/png" href="/Favicon2.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="/Favicon1.png" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <style>
    @font-face {
      font-family: 'Instrument Sans';
      src: url('/fonts/InstrumentSans.woff2') format('woff2');
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --page: #030d1d;
      --white: #f5f7fb;
      --rule: rgba(182, 199, 227, .18);
      --rule-hover: rgba(208, 222, 244, .55);
      --focus: #d3e1ff;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background-color: var(--page);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Instrument Sans', -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      background: radial-gradient(
        circle at center,
        #081d3b 0%,
        #030d1d 55%,
        #01060e 100%
      );
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: inherit;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 5px;
    }

    input:focus-visible,
    textarea:focus-visible {
      outline: none;
    }

    /* LAYOUT */

    .shell {
      width: min(100% - 112px, 1232px);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
    }

    .contact {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(0, .98fr);
      grid-template-rows: auto auto;
      grid-template-areas:
        "nav editorial"
        "form editorial";
      row-gap: 32px;
      align-content: center;
      align-items: start;
      padding: 36px 0;
    }

    /* BACK NAVIGATION */

    .contact-nav {
      grid-area: nav;
      display: flex;
      align-items: center;
      min-height: 19px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #a2b1c7;
      text-decoration: none;
      font-size: 13px;
      font-weight: 400;
      transition: color .2s ease;
    }

    .home-link svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      transition: transform .2s ease;
    }

    .home-link:hover {
      color: #fff;
    }

    .home-link:hover svg {
      transform: translateX(-3px);
    }

    /* RIGHT COLUMN */

    .editorial {
      grid-area: editorial;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 40px 0 0 clamp(42px, 5.8vw, 90px);
    }

    h1 {
      margin: 0;
      font-size: clamp(70px, 7.7vw, 116px);
      font-weight: 500;
      line-height: 1.06;
      letter-spacing: -.082em;
    }

    h1 .dot {
      color: #b3c2d8;
    }

    .lead {
      max-width: 430px;
      margin: 43px 0 17px;
      font-size: clamp(21px, 2vw, 26px);
      font-weight: 400;
      line-height: 1.38;
      letter-spacing: -.035em;
    }

    /* X LINK */

    .social-link {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 7px;
      margin-top: 9px;
      color: #8b9bb4;
      font-size: 13px;
      text-decoration: none;
      transition: color .25s ease;
    }

    .social-link:hover {
      color: #fff;
    }

    .social-link svg {
      width: 13px;
      height: 13px;
      transition: transform .25s ease;
    }

    .social-link:hover svg {
      transform: translate(2px, -2px);
    }

    /* LEFT COLUMN */

    .form-column {
      grid-area: form;
      width: 100%;
      min-height: 509px;
      border-right: 1px solid var(--rule);
      padding: 0 clamp(42px, 5.8vw, 90px) 0 0;
    }

    .form-heading {
      padding-bottom: 19px;
      border-bottom: 1px solid var(--rule);
    }

    .form-heading h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: -.012em;
      font-weight: 500;
      line-height: 1.5;
    }

    /* FORM FIELDS */

    .field {
      padding-top: 24px;
    }

    .field label {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: #d5deee;
      font-size: 13px;
      font-weight: 500;
    }

    .field label .optional {
      color: #6f809d;
      font-weight: 400;
    }

    .field input,
    .field textarea {
      display: block;
      width: 100%;
      padding: 14px 0 15px;
      border: 0;
      border-bottom: 1px solid var(--rule);
      border-radius: 0;
      background: transparent;
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      transition: border-color .2s ease;
      appearance: none;
    }

    .field input {
      height: 54px;
    }

    .field textarea {
      min-height: 115px;
      max-height: 300px;
      resize: vertical;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #657792;
      opacity: 1;
    }

    .field input:hover,
    .field textarea:hover {
      border-bottom-color: var(--rule-hover);
    }

    .field input:focus,
    .field textarea:focus {
      border-bottom-color: #d5e2f7;
    }

    .field:focus-within label {
      color: #fff;
    }

    /* CHARACTER COUNTER */

    .character-counter {
      display: flex;
      justify-content: flex-end;
      margin-top: 9px;
      color: #7789a3;
      font-size: 12px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      line-height: 1.5;
      transition: color .2s ease;
    }

    .character-counter.is-limit {
      color: #d5deee;
    }

    /* FORM FOOTER */

    .footer-form {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 22px;
      margin-top: 26px;
    }

    .privacy {
      max-width: 300px;
      margin: 0;
      font-size: 13px;
      color: #899bb5;
      line-height: 1.65;
    }

    .privacy a {
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: #5b708e;
    }

    .privacy a:hover {
      color: #fff;
    }

    /* SUBMIT BUTTON */

    .send {
      flex-shrink: 0;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 47px;
      padding: 0 19px;
      border: 1px solid rgba(255, 255, 255, .86);
      border-radius: 5px;
      background: #f8f9fc;
      color: #071329;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition:
        background .2s ease,
        transform .2s ease,
        opacity .2s ease;
    }

    .send svg {
      width: 16px;
      height: 16px;
    }

    .send:hover:not(:disabled) {
      background: #dbe6f7;
      transform: translateY(-1px);
    }

    .send:disabled {
      opacity: .72;
      cursor: wait;
    }

    /* FORM AND SUCCESS STATE */

    .submission-swap {
      display: grid;
      width: 100%;
    }

    .contact-form-area,
    .contact-success {
      grid-area: 1 / 1;
      min-width: 0;
    }

    .contact-form-area {
      opacity: 1;
      visibility: visible;
      transition:
        opacity .35s ease,
        visibility .35s ease;
    }

    .submission-swap.is-success .contact-form-area {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .contact-success {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 12px;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(7px);
      transition:
        opacity .55s .2s cubic-bezier(.16, 1, .3, 1),
        transform .55s .2s cubic-bezier(.16, 1, .3, 1),
        visibility .55s .2s;
    }

    .submission-swap.is-success .contact-success {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .success-icon {
      width: 39px;
      height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
      border: 1px solid rgba(208, 222, 244, .12);
      border-radius: 50%;
      background: rgba(255, 255, 255, .035);
      color: #e6edf8;
    }

    .success-icon svg {
      width: 18px;
      height: 18px;
    }

    @keyframes draw-check {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }

    .success-icon polyline {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
    }

    .submission-swap.is-success .success-icon polyline {
      animation:
        draw-check .5s .4s
        cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .success-title {
      margin: 0;
      color: #f5f7fb;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -.018em;
      line-height: 1.45;
    }

    .success-description {
      margin: 0;
      color: #91a1ba;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.65;
    }

    /* ERROR MESSAGE */

    .form-error {
      min-height: 32px;
      margin: 12px 0 0;
      color: #dca6a6;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.5;
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s ease;
    }

    .form-error.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* SPAM PROTECTION */

    .honeypot {
      position: absolute !important;
      left: -10000px !important;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    /* TABLET */

    @media (max-width: 1050px) {
      .shell {
        width: min(100% - 72px, 1232px);
      }

      .editorial {
        padding-left: 35px;
      }

      .form-column {
        padding-right: 35px;
      }

      .footer-form {
        align-items: stretch;
        flex-direction: column;
        gap: 20px;
      }

      .privacy {
        max-width: none;
      }

      .send {
        align-self: flex-start;
      }
    }

    /* SHORT SCREENS */

    @media (max-height: 700px) and (min-width: 761px) {
      .contact {
        row-gap: 22px;
        padding: 22px 0;
      }

      .editorial {
        min-height: 500px;
        padding-top: 30px;
      }

      .form-column {
        min-height: 459px;
      }
    }

    /* MOBILE */

    @media (max-width: 760px) {
      .shell {
        width: min(100% - 44px, 560px);
      }

      .contact {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        padding: 51px 0 72px;
      }

      .contact-nav {
        order: 1;
        margin-bottom: 34px;
      }

      .editorial {
        order: 2;
        min-height: 0;
        padding: 0;
      }

      h1 {
        font-size: clamp(66px, 14vw, 95px);
      }

      .lead {
        margin: 27px 0 13px;
        font-size: 22px;
      }

      .form-column {
        order: 3;
        min-height: 0;
        border-right: 0;
        padding: 48px 0 0;
      }

      .form-heading {
        padding-bottom: 18px;
      }

      .footer-form {
        margin-top: 22px;
        gap: 22px;
      }

      .send {
        min-width: 190px;
      }

      .contact-success {
        min-height: 375px;
      }
    }

    @media (max-width: 420px) {
      .shell {
        width: calc(100% - 36px);
      }

      .home-link {
        gap: 7px;
        font-size: 12px;
      }

      .contact {
        padding-top: 39px;
      }

      .lead {
        font-size: 21px;
      }

      .form-column {
        padding-top: 42px;
      }

      .field {
        padding-top: 21px;
      }

      .field input,
      .field textarea {
        font-size: 16px;
      }

      .send {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="shell">

    <main class="contact">

      <!-- BACK NAVIGATION -->

      <nav class="contact-nav" aria-label="Sidnavigering">
        <a class="home-link" href="/">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 12H5m7 7-7-7 7-7"/>
          </svg>
          Till startsidan
        </a>
      </nav>

      <!-- RIGHT COLUMN -->

      <section class="editorial" aria-labelledby="page-title">
        <h1 id="page-title">Kontakt<span class="dot">.</span></h1>

        <p class="lead">
          Har du en fråga, en idé eller ett förslag?
        </p>

        <a
          class="social-link"
          href="https://x.com/juridikai"
          target="_blank"
          rel="noopener noreferrer"
        >
          Följ @juridikai på X

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M7 17 17 7M7 7h10v10"/>
          </svg>
        </a>
      </section>

      <!-- LEFT COLUMN -->

      <section class="form-column" aria-labelledby="form-title">

        <div class="form-heading">
          <h2 id="form-title">Skriv till oss</h2>
        </div>

        <div class="submission-swap" id="submission-swap">

          <div class="contact-form-area" id="contact-form-area">

            <form
              id="contact-form"
              action="https://formspree.io/f/xaeekvnp"
              method="POST"
            >

              <div class="field">
                <label for="contact-name">
                  Namn <span class="optional">(valfritt)</span>
                </label>

                <input
                  id="contact-name"
                  type="text"
                  name="name"
                  autocomplete="name"
                  maxlength="100"
                >
              </div>

              <div class="field">
                <label for="contact-email">E-post</label>

                <input
                  id="contact-email"
                  type="email"
                  name="email"
                  autocomplete="email"
                  maxlength="254"
                  placeholder="namn@exempel.se"
                  required
                >
              </div>

              <div class="field">
                <label for="contact-message">Meddelande</label>

                <textarea
                  id="contact-message"
                  name="message"
                  required
                  minlength="10"
                  maxlength="2000"
                  aria-describedby="message-counter"
                ></textarea>

                <div
                  id="message-counter"
                  class="character-counter"
                >0 / 2 000</div>
              </div>

              <!-- HONEYPOT -->

              <div class="honeypot" aria-hidden="true">
                <label for="contact-company">
                  Lämna detta fält tomt
                </label>

                <input
                  id="contact-company"
                  name="_gotcha"
                  type="text"
                  tabindex="-1"
                  autocomplete="off"
                >
              </div>

              <input
                type="hidden"
                name="_subject"
                value="Nytt kontaktmeddelande – Juridik.ai"
              >

              <div class="footer-form">

                <p class="privacy">
                  Skicka inte personnummer eller känsliga uppgifter.
                  Läs vår <a href="/policy/">integritetspolicy</a>.
                </p>

                <button
                  class="send"
                  id="submit-button"
                  type="submit"
                >
                  <span id="submit-label">
                    Skicka meddelande
                  </span>

                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M5 12h14m-7-7 7 7-7 7"/>
                  </svg>
                </button>

              </div>

              <p
                id="form-error"
                class="form-error"
                role="alert"
                aria-live="assertive"
                aria-atomic="true"
              ></p>

            </form>

          </div>

          <!-- SUCCESS STATE -->

          <div
            id="contact-success"
            class="contact-success"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            <div class="success-icon" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>

            <p class="success-title">
              Meddelandet är skickat.
            </p>

            <p class="success-description">
              Vi återkommer så snart vi kan.
            </p>
          </div>

        </div>

        <noscript>
          <p class="privacy">
            JavaScript är avstängt. Formuläret skickas då via
            Formsprees vanliga formulärhantering.
          </p>
        </noscript>

      </section>

    </main>

  </div>

  <script>
    (() => {
      'use strict';

      const wrapper = document.getElementById('submission-swap');
      const formArea = document.getElementById('contact-form-area');
      const form = document.getElementById('contact-form');
      const success = document.getElementById('contact-success');
      const button = document.getElementById('submit-button');
      const buttonLabel = document.getElementById('submit-label');
      const errorMsg = document.getElementById('form-error');
      const messageInput = document.getElementById('contact-message');
      const messageCounter = document.getElementById('message-counter');

      const REQUEST_TIMEOUT_MS = 15000;
      const MAX_MESSAGE_LENGTH = 2000;

      let isSubmitting = false;
      let controller = null;
      let timeoutId = null;
      let requestVersion = 0;
      let pageIsActive = true;

      function updateCounter() {
        const length = messageInput.value.length;

        messageCounter.textContent =
          `${length.toLocaleString('sv-SE')} / 2 000`;

        messageCounter.classList.toggle(
          'is-limit',
          length >= MAX_MESSAGE_LENGTH
        );
      }

      function clearError() {
        errorMsg.textContent = '';
        errorMsg.classList.remove('is-visible');
      }

      function showError(message) {
        errorMsg.textContent = message;
        errorMsg.classList.add('is-visible');
      }

      function clearRequestTimeout() {
        if (timeoutId !== null) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }
      }

      function cancelPendingRequest() {
        requestVersion++;
        clearRequestTimeout();

        if (controller) {
          controller.abort();
          controller = null;
        }

        isSubmitting = false;
      }

      function resetFormUI() {
        cancelPendingRequest();

        wrapper.classList.remove('is-success');
        formArea.inert = false;
        success.inert = true;

        button.disabled = false;
        buttonLabel.textContent = 'Skicka meddelande';

        clearError();
        updateCounter();
      }

      success.inert = true;

      updateCounter();

      messageInput.addEventListener('input', updateCounter);
      form.addEventListener('input', clearError);

      window.addEventListener('pageshow', (event) => {
        pageIsActive = true;

        if (event.persisted) {
          resetFormUI();
        }
      });

      window.addEventListener('pagehide', () => {
        pageIsActive = false;
        cancelPendingRequest();
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (
          isSubmitting ||
          wrapper.classList.contains('is-success')
        ) {
          return;
        }

        if (messageInput.value.length > MAX_MESSAGE_LENGTH) {
          showError(
            'Meddelandet får innehålla högst 2 000 tecken.'
          );

          messageInput.focus();
          return;
        }

        if (!form.reportValidity()) {
          return;
        }

        clearError();

        isSubmitting = true;
        button.disabled = true;
        buttonLabel.textContent = 'Skickar…';

        const currentVersion = ++requestVersion;
        const currentController = new AbortController();

        controller = currentController;

        let timedOut = false;

        timeoutId = setTimeout(() => {
          timedOut = true;
          currentController.abort();
        }, REQUEST_TIMEOUT_MS);

        try {
          const response = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: {
              Accept: 'application/json'
            },
            signal: currentController.signal
          });

          if (
            currentVersion !== requestVersion ||
            !pageIsActive
          ) {
            return;
          }

          if (!response.ok) {
            if (response.status === 429) {
              showError(
                'För många försök. Försök igen senare.'
              );
            } else if (
              response.status === 400 ||
              response.status === 422
            ) {
              showError(
                'Kontrollera uppgifterna och försök igen.'
              );
            } else {
              showError(
                'Kunde inte skicka. Försök igen.'
              );
            }

            return;
          }

          wrapper.classList.add('is-success');
          formArea.inert = true;
          success.inert = false;

        } catch (error) {
          if (
            currentVersion !== requestVersion ||
            !pageIsActive
          ) {
            return;
          }

          if (timedOut || error.name === 'AbortError') {
            showError(
              'Ingen bekräftelse mottogs. Kontrollera innan du försöker igen.'
            );
          } else if (error instanceof TypeError) {
            showError(
              'Anslutningen misslyckades. Kontrollera internetanslutningen.'
            );
          } else {
            showError(
              'Kunde inte skicka. Försök igen.'
            );
          }

        } finally {
          if (currentVersion === requestVersion) {
            clearRequestTimeout();

            controller = null;
            isSubmitting = false;

            if (!wrapper.classList.contains('is-success')) {
              button.disabled = false;
              buttonLabel.textContent = 'Skicka meddelande';
            }
          }
        }
      });
    })();
  </script>
</body>
</html>
