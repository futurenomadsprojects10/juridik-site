<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juridik.ai</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 32px 24px;
      font-family: 'DM Serif Display', Georgia, serif;
      background: radial-gradient(circle at center, #081a36 0%, #030d1e 50%, #01060e 100%);
      background-color: #030d1e;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .spacer {
      height: 20px;
    }

    .container {
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0px;
    }

    .brand-img {
      width: 210px;
      height: auto;
      display: block;
      margin-bottom: 0px;
    }

    /* Textsektion */
    .text-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: -2px;
    }

    .tagline {
      font-size: 1.45rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: -0.01em;
      line-height: 1.3;
    }

    .contact-line {
      font-size: 1.15rem;
      font-weight: 400;
      line-height: 1.3;
    }

    .x-link {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .x-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Diskret mejladress: samma serif-font och mörkare ton */
    .footer-email {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
    }

    .footer-email a {
      color: rgba(255, 255, 255, 0.18);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-email a:hover {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .brand-img {
        width: 170px;
      }
      .tagline {
        font-size: 1.25rem;
      }
      .contact-line {
        font-size: 1.05rem;
      }
      .footer-email {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="spacer"></div>

  <div class="container">
    <img src="LOGGA%20VIT%20PNG.png" alt="Juridik.ai" class="brand-img">
    <div class="text-block">
      <p class="tagline">Vi bygger något spännande…</p>
      <p class="contact-line"><a href="https://x.com/juridikai" target="_blank" rel="noopener noreferrer" class="x-link">@JuridikAI on X</a></p>
    </div>
  </div>

  <div class="footer-email">
    <a href="mailto:futurenomadsprojects@gmail.com">futurenomadsprojects@gmail.com</a>
  </div>

</body>
</html>
