<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juridik.ai</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at center, #092042 0%, #030d1d 55%, #01060e 100%);
      background-color: #030d1d;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .top-spacer {
      height: 24px;
      visibility: hidden;
    }

    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      width: 100%;
      max-width: 380px;
      gap: 28px;
    }

    .brand-logo {
      width: 115px;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.4));
    }

    /* --- WAITLIST INPUT --- */
    .waitlist-wrapper {
      width: 100%;
      position: relative;
      min-height: 52px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .waitlist-form {
      width: 100%;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      padding: 5px 5px 5px 18px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Subtil vit ljusning vid hovring */
    .waitlist-form:hover {
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Ren, vit accent och mjuk vit skugga vid fokus */
    .waitlist-form:focus-within {
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.06);
    }

    /* Mjuk fade-out vid submit */
    .waitlist-form.fade-out {
      opacity: 0;
      transform: scale(0.96) translateY(-4px);
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .waitlist-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 400;
      letter-spacing: -0.01em;
      min-width: 0;
    }

    .waitlist-input::placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-weight: 300;
      transition: color 0.3s ease;
    }

    .waitlist-input:focus::placeholder {
      color: rgba(255, 255, 255, 0.15);
    }

    .waitlist-btn {
      background-color: #ffffff;
      color: #030d1d;
      border: none;
      border-radius: 9999px;
      padding: 9px 16px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .waitlist-btn:hover {
      background-color: #f1f5f9;
      transform: translateY(-0.5px);
    }

    .waitlist-btn:active {
      transform: scale(0.96);
    }

    /* --- STATUS MEDDELANDE --- */
    @keyframes status-pop-in {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .form-status {
      font-size: 0.86rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: -0.01em;
      opacity: 0;
      position: absolute;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .form-status.visible {
      display: inline-flex;
      animation: status-pop-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .form-status svg {
      width: 15px;
      height: 15px;
      color: #ffffff;
      opacity: 0.9;
    }

    @keyframes draw-check {
      0% {
        stroke-dashoffset: 24;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    .form-status svg polyline {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      animation: draw-check 0.5s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* --- X BADGE --- */
    .x-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      background-color: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      color: rgba(255, 255, 255, 0.45);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 400;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .x-badge:hover {
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-0.5px);
    }

    .x-badge svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .footer {
      padding-top: 16px;
    }

    .footer-email {
      font-family: 'Geist', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    .footer-email a {
      color: rgba(255, 255, 255, 0.16);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-email a:hover {
      color: rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 480px) {
      body {
        padding: 32px 20px;
      }
      .brand-logo {
        width: 100px;
      }
      .hero-container {
        gap: 22px;
        max-width: 320px;
      }
      .waitlist-wrapper {
        min-height: 48px;
      }
      .waitlist-form {
        padding: 4px 4px 4px 15px;
      }
      .waitlist-input {
        font-size: 0.84rem;
      }
      .waitlist-btn {
        padding: 8px 13px;
        font-size: 0.78rem;
      }
      .form-status {
        font-size: 0.82rem;
      }
      .footer-email {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <div class="top-spacer" aria-hidden="true"></div>

  <main class="hero-container">
    <img src="LOGGA%20VIT%20PNG.png" alt="Juridik.ai" class="brand-logo">
    
    <div class="waitlist-wrapper">
      <form class="waitlist-form" id="waitlist-form" action="https://formspree.io/f/xppzwjqk" method="POST">
        <input 
          type="email" 
          name="email" 
          class="waitlist-input" 
          placeholder="Din e-postadress..." 
          required
          autocomplete="email"
        >
        <button type="submit" class="waitlist-btn" id="submit-btn">Join waitlist</button>
      </form>
      
      <div id="status-msg" class="form-status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>Du är tillagd på väntelistan.</span>
      </div>
    </div>

    <a href="https://x.com/juridikai" target="_blank" rel="noopener noreferrer" class="x-badge">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      <span>@JuridikAI</span>
    </a>
  </main>

  <footer class="footer">
    <div class="footer-email">
      <a href="mailto:futurenomadsprojects@gmail.com">futurenomadsprojects@gmail.com</a>
    </div>
  </footer>

  <script>
    const form = document.getElementById("waitlist-form");
    const statusMsg = document.getElementById("status-msg");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = "...";

      const data = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: data,
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          form.classList.add('fade-out');
          
          setTimeout(() => {
            form.style.display = "none";
            statusMsg.style.display = "flex";
            
            setTimeout(() => {
              statusMsg.classList.add("visible");
            }, 30);
          }, 450); 

        } else {
          alert("Något gick fel, försök igen.");
          submitBtn.disabled = false;
          submitBtn.innerText = "Join waitlist";
        }
      } catch (error) {
        alert("Något gick fel, försök igen.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Join waitlist";
      }
    });
  </script>

</body>
</html>
