
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Juridik.ai</title>

  <meta
    name="description"
    content="Juridik.ai – Studera juridik smartare med AI. Gå med och få uppdateringar inför lanseringen."
  >

  <meta name="theme-color" content="#030d1d">
  <meta name="color-scheme" content="dark">

  <link rel="canonical" href="https://juridik.ai/">

  <!-- Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="sv_SE">
  <meta property="og:site_name" content="Juridik.ai">
  <meta property="og:title" content="Juridik.ai">
  <meta
    property="og:description"
    content="Studera juridik smartare med AI. Gå med och få uppdateringar inför lanseringen."
  >
  <meta property="og:url" content="https://juridik.ai/">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Juridik.ai">
  <meta
    name="twitter:description"
    content="Studera juridik smartare med AI. Gå med inför lanseringen."
  >

  <!-- Favicons -->
  <link
    rel="icon"
    type="image/png"
    href="/Favicon1.png"
    media="(prefers-color-scheme: light)"
  >
  <link
    rel="icon"
    type="image/png"
    href="/Favicon2.png"
    media="(prefers-color-scheme: dark)"
  >

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    /* ========================================
       RESET
    ======================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      background-color: #030d1d;
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

      padding: 40px 24px;
      text-align: center;

      font-family:
        'Geist',
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      background:
        radial-gradient(
          circle at center,
          #092042 0%,
          #030d1d 55%,
          #01060e 100%
        );

      color: #ffffff;

      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      overflow-x: hidden;
    }

    /* ========================================
       LAYOUT
    ======================================== */

    .top-spacer {
      height: 24px;
      flex-shrink: 0;
      visibility: hidden;
    }

    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;

      margin: auto 0;

      width: 100%;
      max-width: 380px;
      gap: 28px;
    }

    .brand-logo {
      width: 115px;
      height: auto;
      display: block;
      flex-shrink: 0;

      filter:
        drop-shadow(
          0 10px 30px rgba(0, 0, 0, 0.4)
        );
    }

    /* ========================================
       WAITLIST LAYOUT
    ======================================== */

    .waitlist-wrapper {
      width: 100%;
      position: relative;

      min-height: 52px;

      display: grid;
      align-items: center;
      justify-items: center;
    }

    .waitlist-form-area,
    .form-status {
      grid-area: 1 / 1;
      width: 100%;
      min-width: 0;
    }

    .waitlist-form-area {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 10px;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .waitlist-wrapper.is-success .waitlist-form-area {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ========================================
       EMAIL FORM
    ======================================== */

    .waitlist-form {
      width: 100%;
      display: flex;
      align-items: center;

      background:
        rgba(255, 255, 255, 0.03);

      border:
        1px solid rgba(255, 255, 255, 0.1);

      border-radius: 9999px;

      padding: 5px 5px 5px 18px;

      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);

      transition:
        background-color 0.35s
          cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.35s
          cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.35s
          cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Hover only on devices with real hover */
    @media (hover: hover) and (pointer: fine) {
      .waitlist-form:hover {
        border-color:
          rgba(255, 255, 255, 0.22);

        background:
          rgba(255, 255, 255, 0.05);
      }
    }

    .waitlist-form:focus-within {
      border-color:
        rgba(255, 255, 255, 0.45);

      background:
        rgba(255, 255, 255, 0.06);

      box-shadow:
        0 0 20px rgba(255, 255, 255, 0.06);
    }

    .waitlist-input {
      flex: 1;
      min-width: 0;

      background: transparent;

      border: none;
      outline: none;

      color: #ffffff;

      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 400;

      letter-spacing: -0.01em;

      appearance: none;
      -webkit-appearance: none;
    }

    .waitlist-input::placeholder {
      color:
        rgba(255, 255, 255, 0.3);

      font-weight: 300;
      opacity: 1;

      transition: color 0.3s ease;
    }

    .waitlist-input:focus::placeholder {
      color:
        rgba(255, 255, 255, 0.15);
    }

    /* ========================================
       SUBMIT BUTTON
    ======================================== */

    .waitlist-btn {
      background-color: #ffffff;
      color: #030d1d;

      border: none;
      border-radius: 9999px;

      padding: 9px 16px;

      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;

      letter-spacing: -0.01em;

      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;

      transition:
        background-color 0.25s
          cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.25s
          cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (hover: hover) and (pointer: fine) {
      .waitlist-btn:hover:not(:disabled) {
        background-color: #f1f5f9;
        transform: translateY(-0.5px);
      }
    }

    .waitlist-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .waitlist-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* ========================================
       PRIVACY NOTICE
    ======================================== */

    .privacy-notice {
      width: 100%;

      font-family: 'Geist', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;

      letter-spacing: 0.01em;
      line-height: 1.6;

      color:
        rgba(255, 255, 255, 0.16);

      text-align: center;
    }

    .privacy-cta {
      white-space: nowrap;
    }

    .privacy-notice a {
      color:
        rgba(255, 255, 255, 0.16);

      text-decoration: underline;
      text-underline-offset: 2px;

      transition: color 0.25s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .privacy-notice a:hover {
        color:
          rgba(255, 255, 255, 0.5);
      }
    }

    /* ========================================
       SUCCESS MESSAGE
    ======================================== */

    @keyframes status-pop-in {
      from {
        opacity: 0;
        transform:
          translateY(8px) scale(0.96);
      }

      to {
        opacity: 1;
        transform:
          translateY(0) scale(1);
      }
    }

    .form-status {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      padding: 0 4px;

      font-size: 0.86rem;
      font-weight: 400;
      letter-spacing: -0.01em;

      line-height: 1.5;

      color:
        rgba(255, 255, 255, 0.9);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      overflow-wrap: break-word;
    }

    .form-status span {
      min-width: 0;
    }

    .waitlist-wrapper.is-success .form-status {
      visibility: visible;

      animation:
        status-pop-in 0.6s
        cubic-bezier(0.16, 1, 0.3, 1)
        forwards;
    }

    .form-status svg {
      width: 15px;
      height: 15px;

      color: #ffffff;
      opacity: 0.9;

      flex-shrink: 0;
    }

    @keyframes draw-check {
      from {
        stroke-dashoffset: 24;
      }

      to {
        stroke-dashoffset: 0;
      }
    }

    .form-status svg polyline {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
    }

    .waitlist-wrapper.is-success
    .form-status svg polyline {
      animation:
        draw-check 0.5s 0.2s
        cubic-bezier(0.16, 1, 0.3, 1)
        forwards;
    }

    /* ========================================
       INLINE ERROR MESSAGE
    ======================================== */

    .form-error {
      display: none;

      width: 100%;
      max-width: 100%;

      padding: 0 4px;

      font-size: 0.75rem;
      font-weight: 300;
      line-height: 1.5;

      color:
        rgba(255, 190, 190, 0.85);

      text-align: center;
    }

    .form-error.is-visible {
      display: block;
    }

    /* ========================================
       X BADGE
    ======================================== */

    .x-badge {
      display: inline-flex;
      align-items: center;

      gap: 7px;

      padding: 6px 14px;

      background-color: transparent;

      border:
        1px solid rgba(255, 255, 255, 0.08);

      border-radius: 9999px;

      color:
        rgba(255, 255, 255, 0.45);

      text-decoration: none;

      font-size: 0.8rem;
      font-weight: 400;

      transition:
        border-color 0.25s
          cubic-bezier(0.16, 1, 0.3, 1),
        color 0.25s
          cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.25s
          cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (hover: hover) and (pointer: fine) {
      .x-badge:hover {
        border-color:
          rgba(255, 255, 255, 0.25);

        color: #ffffff;

        transform: translateY(-0.5px);
      }
    }

    .x-badge:active {
      transform: scale(0.98);
    }

    .x-badge svg {
      width: 12px;
      height: 12px;

      fill: currentColor;
      flex-shrink: 0;
    }

    /* ========================================
       FOOTER
    ======================================== */

    .footer {
      padding-top: 16px;
      flex-shrink: 0;
    }

    .footer-email {
      font-family: 'Geist', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    .footer-email a {
      display: inline-block;

      color:
        rgba(255, 255, 255, 0.16);

      text-decoration: none;

      transition:
        color 0.25s ease,
        transform 0.25s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .footer-email a:hover {
        color:
          rgba(255, 255, 255, 0.5);

        transform: translateY(-0.5px);
      }
    }

    /* ========================================
       ACCESSIBILITY
    ======================================== */

    .waitlist-btn:focus-visible,
    .x-badge:focus-visible,
    .privacy-notice a:focus-visible,
    .footer-email a:focus-visible {
      outline:
        2px solid rgba(255, 255, 255, 0.65);

      outline-offset: 4px;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 480px) {
      body {
        padding: 32px 20px;
      }

      .brand-logo {
        width: 100px;
      }

      .hero-container {
        gap: 22px;
        max-width: 320px;
      }

      .waitlist-wrapper {
        min-height: 48px;
      }

      .waitlist-form {
        padding: 4px 4px 4px 15px;
      }

      .waitlist-input {
        font-size: 0.84rem;
      }

      .waitlist-btn {
        padding: 8px 13px;
        font-size: 0.78rem;
      }

      .form-status {
        font-size: 0.82rem;
      }

      .footer-email,
      .privacy-notice {
        font-size: 0.7rem;
      }
    }

    /* Small-height devices */
    @media (max-height: 480px) {
      body {
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .hero-container {
        gap: 18px;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="top-spacer" aria-hidden="true"></div>

  <main class="hero-container">

    <img
      src="/Logo2.png"
      alt="Juridik.ai"
      class="brand-logo"
      width="115"
      height="115"
      fetchpriority="high"
      decoding="async"
    >

    <div
      class="waitlist-wrapper"
      id="waitlist-wrapper"
    >

      <div
        class="waitlist-form-area"
        id="waitlist-form-area"
      >

        <form
          class="waitlist-form"
          id="waitlist-form"
          action="https://formspree.io/f/xppzwjqk"
          method="POST"
          aria-label="Anmäl dig till Juridik.ai:s lanseringsuppdateringar"
        >

          <input
            type="email"
            name="email"
            class="waitlist-input"
            id="email-input"
            placeholder="Din e-postadress..."
            required
            autocomplete="email"
            inputmode="email"
            maxlength="254"
            aria-label="Din e-postadress"
            aria-describedby="form-error"
          >

          <button
            type="submit"
            class="waitlist-btn"
            id="submit-btn"
          >
            Gå med
          </button>

        </form>

        <p class="privacy-notice">
          Genom att gå med får du uppdateringar om vår lansering.
          <span class="privacy-cta">
            Läs vår <a href="https://juridik.ai/policy/">integritetspolicy</a>.
          </span>
        </p>

        <p
          class="form-error"
          id="form-error"
          role="alert"
          aria-live="assertive"
          aria-atomic="true"
        ></p>

      </div>

      <div
        class="form-status"
        id="status-msg"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>

        <span>
          Du är uppskriven! Följ oss på X nedanför.
        </span>

      </div>

    </div>

    <a
      href="https://x.com/juridikai"
      target="_blank"
      rel="noopener noreferrer"
      class="x-badge"
      aria-label="Följ Juridik.ai på X"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>

      <span>@JuridikAI</span>
    </a>

  </main>

  <footer class="footer">
    <div class="footer-email">
      <a href="mailto:futurenomadsprojects@gmail.com">
        futurenomadsprojects@gmail.com
      </a>
    </div>
  </footer>

  <script>
    (() => {
      "use strict";

      const wrapper = document.getElementById("waitlist-wrapper");
      const formArea = document.getElementById("waitlist-form-area");
      const form = document.getElementById("waitlist-form");
      const statusMsg = document.getElementById("status-msg");
      const submitBtn = document.getElementById("submit-btn");
      const emailInput = document.getElementById("email-input");
      const errorMsg = document.getElementById("form-error");

      const REQUEST_TIMEOUT_MS = 15000;

      let isSubmitting = false;
      let controller = null;
      let requestVersion = 0;
      let timeoutId = null;
      let pageIsActive = true;

      // =====================================
      // ERROR HANDLING
      // =====================================

      function clearError() {
        errorMsg.textContent = "";
        errorMsg.classList.remove("is-visible");
        emailInput.removeAttribute("aria-invalid");
      }

      function showError(message) {
        errorMsg.textContent = message;
        errorMsg.classList.add("is-visible");
        emailInput.setAttribute("aria-invalid", "true");
      }

      // =====================================
      // CLEANUP
      // =====================================

      function clearRequestTimeout() {
        if (timeoutId !== null) {
          clearTimeout(timeoutId);
          timeoutId = null;
        }
      }

      function cancelPendingRequest() {
        requestVersion++;

        clearRequestTimeout();

        if (controller) {
          controller.abort();
          controller = null;
        }

        isSubmitting = false;
      }

      // =====================================
      // RESET UI
      // =====================================

      function resetFormUI() {
        cancelPendingRequest();

        wrapper.classList.remove("is-success");

        formArea.inert = false;
        statusMsg.inert = true;

        submitBtn.disabled = false;
        submitBtn.textContent = "Gå med";

        clearError();
      }

      // Initial accessibility state
      statusMsg.inert = true;

      // =====================================
      // PAGE LIFECYCLE
      // =====================================

      window.addEventListener("pageshow", (event) => {
        pageIsActive = true;

        if (event.persisted) {
          resetFormUI();
        }
      });

      window.addEventListener("pagehide", () => {
        pageIsActive = false;
        cancelPendingRequest();
      });

      // Remove errors when user edits email
      emailInput.addEventListener("input", clearError);

      // =====================================
      // SUBMISSION
      // =====================================

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (
          isSubmitting ||
          wrapper.classList.contains("is-success")
        ) {
          return;
        }

        if (!form.reportValidity()) {
          return;
        }

        clearError();

        isSubmitting = true;

        submitBtn.disabled = true;
        submitBtn.textContent = "...";

        const currentVersion = ++requestVersion;
        const currentController = new AbortController();

        controller = currentController;

        let timedOut = false;

        timeoutId = setTimeout(() => {
          timedOut = true;
          currentController.abort();
        }, REQUEST_TIMEOUT_MS);

        try {
          const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: {
              Accept: "application/json"
            },
            signal: currentController.signal
          });

          if (
            currentVersion !== requestVersion ||
            !pageIsActive
          ) {
            return;
          }

          if (!response.ok) {
            throw new Error("Submission failed");
          }

          // Successful registration
          wrapper.classList.add("is-success");

          formArea.inert = true;
          statusMsg.inert = false;

        } catch (error) {
          if (
            currentVersion !== requestVersion ||
            !pageIsActive
          ) {
            return;
          }

          if (timedOut || error.name === "AbortError") {
            showError(
              "Registreringen kunde inte bekräftas. Kontrollera din anslutning innan du försöker igen."
            );
          } else if (error instanceof TypeError) {
            showError(
              "Kunde inte ansluta. Kontrollera din internetanslutning och försök igen."
            );
          } else {
            showError(
              "Kunde inte registrera din e-post. Försök igen."
            );
          }

        } finally {
          if (currentVersion === requestVersion) {
            clearRequestTimeout();

            controller = null;
            isSubmitting = false;

            if (!wrapper.classList.contains("is-success")) {
              submitBtn.disabled = false;
              submitBtn.textContent = "Gå med";
            }
          }
        }
      });

    })();
  </script>

</body>
</html>
