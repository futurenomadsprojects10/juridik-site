<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juridik.ai</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at center, #081a36 0%, #030d1e 50%, #01060e 100%);
      background-color: #030d1e;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Styr storlek och avstånd för din uppladdade logotyp */
    .brand-img {
      width: 220px;
      height: auto;
      display: block;
      margin-bottom: 4px;
    }

    /* Textsektion */
    .text-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tagline, .contact-line {
      font-size: 1.15rem;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: -0.01em;
      line-height: 1.4;
    }

    .x-link {
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .x-link:hover {
      text-decoration: underline;
      opacity: 0.85;
    }

    /* Anpassning för mindre mobilskärmar */
    @media (max-width: 480px) {
      .brand-img {
        width: 180px;
      }
      .tagline, .contact-line {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Din uppladdade bildfil -->
    <img src="LOGGA%20VIT%20PNG.png" alt="Juridik.ai" class="brand-img">

    <div class="text-block">
      <p class="tagline">Vi bygger något spännande…</p>
      <p class="contact-line"> <a href="https://x.com/juridikai" target="_blank" rel="noopener noreferrer" class="x-link">@JuridikAI on X</a></p>
    </div>

  </div>

</body>
</html>
