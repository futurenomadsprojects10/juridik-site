<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juridik.ai</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at center, #092042 0%, #030d1d 55%, #01060e 100%);
      background-color: #030d1d;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .top-spacer {
      height: 24px;
      visibility: hidden;
    }

    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
      gap: 28px;
    }

    /* Skarp rendering av logotypen */
    .brand-logo {
      width: 125px;
      height: auto;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.35));
    }

    /* Modern startup badge / pill-knapp */
    .x-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background-color: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .x-badge:hover {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .x-badge svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .x-badge:hover svg {
      transform: scale(1.05);
    }

    /* Diskret footer */
    .footer {
      padding-top: 16px;
    }

    .footer-email {
      font-family: 'Geist', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .footer-email a {
      color: rgba(255, 255, 255, 0.16);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-email a:hover {
      color: rgba(255, 255, 255, 0.5);
    }

    @media (max-width: 480px) {
      body {
        padding: 32px 20px;
      }
      .hero-container {
        gap: 22px;
      }
      .brand-logo {
        width: 105px;
      }
      .x-badge {
        font-size: 0.8rem;
        padding: 6px 12px;
        gap: 7px;
      }
      .x-badge svg {
        width: 12px;
        height: 12px;
      }
      .footer-email {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <div class="top-spacer" aria-hidden="true"></div>

  <main class="hero-container">
    <img src="LOGGA%20VIT%20PNG.png" alt="Juridik.ai" class="brand-logo">
    
    <a href="https://x.com/juridikai" target="_blank" rel="noopener noreferrer" class="x-badge">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      <span>@JuridikAI</span>
    </a>
  </main>

  <footer class="footer">
    <div class="footer-email">
      <a href="mailto:futurenomadsprojects@gmail.com">futurenomadsprojects@gmail.com</a>
    </div>
  </footer>

</body>
</html>
