
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 – Juridik.ai</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#030d1d">
  <meta name="color-scheme" content="dark">

  <link rel="icon" type="image/png" href="/Favicon1.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="/Favicon2.png" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: #030d1d;
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(
        circle at center,
        #092042 0%,
        #030d1d 55%,
        #01060e 100%
      );
      font-family: 'Geist', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    h1 {
      color: rgba(255, 255, 255, 0.9);
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
      font-weight: 300;
    }

    a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      font-weight: 400;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }

    a:hover {
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
    }

    a:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.65);
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <h1>404</h1>
    <p>Sidan kunde inte hittas.</p>
    <a href="https://juridik.ai/">Tillbaka till startsidan</a>
  </main>
</body>
</html>
